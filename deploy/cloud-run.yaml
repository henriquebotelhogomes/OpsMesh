apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: opsmesh
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # FinOps Scale-to-Zero ($0/month idle cost)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/opsmesh:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: APP_ENV
              value: "production"
            - name: DEFAULT_LLM_PROVIDER
              value: "deepseek"
            - name: DEMO_MODE
              value: "true"
            - name: FINOPS_DAILY_BUDGET_USD
              value: "1.00"
            - name: FINOPS_DAILY_TOKEN_LIMIT
              value: "150000"
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
