[project]
name = "opsmesh"
version = "0.1.0"
description = "Autonomous Incident Commander Multi-Agent (LangGraph + MCP/OpenAI + HITL)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "OpsMesh Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "scalar-fastapi>=1.0.3",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",
    "mcp>=1.0.0",
    "slowapi>=0.1.9",
    "langgraph-checkpoint-postgres>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.2.0",
    "qdrant-client>=1.10.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "reportlab>=4.2.0",
    "langsmith>=0.1.100",
    "langfuse>=2.50.0",
    "ragas>=0.2.0",
    "datasets>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.5",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",
    "types-PyYAML",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-static-i18n>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
