# ==============================================================================
# OpsMesh — Pre-commit Configuration (Padrão de Qualidade Internacional)
# ==============================================================================
# Garante linting, formatação instantânea, tipagem estrita, formatação de frontend
# e zero vazamento de credenciais antes de qualquer commit ou Pull Request.
# ==============================================================================

repos:
  # 1. Sanitização básica de arquivos e sintaxe
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict

  # 2. Ruff: Linter e Formatter de alta performance para Backend Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # 3. Gitleaks: Bloqueio inviolável contra commit acidental de chaves de API / segredos
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # 4. Mypy: Verificação estrita de tipagem estática
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7.0
          - types-PyYAML
        args: [--ignore-missing-imports, --check-untyped-defs]

  # 5. Prettier: Formatação consistente de Frontend (TS/JS), Markdown, JSON e YAML
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
